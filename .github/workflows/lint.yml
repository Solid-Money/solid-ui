name: Lint & Format

on:
  push:
    branches: [master, qa]
  pull_request:
    branches: [master, qa]

# A new push to a PR makes the run for the previous commit moot, so stop paying
# for it. Pushes to master/qa each keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with Expo (includes Prettier)
        run: npm run lint

      - name: TypeScript compilation check
        run: npx tsc --noEmit
