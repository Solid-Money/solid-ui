# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is the merge gate for PRs into master: it requests changes when it
# finds issues and approves once they are fixed. The approval satisfies the
# branch ruleset's required review, so no human approval is needed.
# Changes to this file require a code-owner review (see .github/CODEOWNERS).
language: en-US
early_access: false

reviews:
  profile: chill
  # Approve automatically once every CodeRabbit comment is resolved, the latest
  # commit has been reviewed and no pre-merge check below is failing.
  request_changes_workflow: true
  # The author must not be able to `@coderabbitai approve` / `resolve` their own PR.
  allow_author_approval: false
  high_level_summary: true
  review_status: true
  # Shows which linked repositories were used as context.
  review_details: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
    # Empty = default branch (master) only.
    base_branches: []
    # Never pause: an unreviewed latest commit means no approval, which blocks merge.
    auto_pause_after_reviewed_commits: 0
  # A PR whose files are all excluded here is approved without review, so only
  # exclude generated output.
  path_filters:
    - "!generated/**"
    - "!assets/**"
    - "!**/*.snap"
  path_instructions:
    - path: "lib/{api.ts,api/**,types/**}"
      instructions: |
        Client for the Solid-Money/solid-backend HTTP APIs (accounts, analytics, rewards, vault-manager).
        Check every request path, method, param and response field against the backend controllers and
        DTOs in the linked solid-backend repository and flag mismatches by name. Response data from the
        network must be treated as untrusted: flag code that would throw on a missing, null or renamed
        field (unguarded property access, .map/.length on possibly undefined values, JSON.parse without
        try/catch).
    - path: "{lib/abis/**,constants/addresses.ts,wagmi.config.ts}"
      instructions: |
        ABIs and addresses must match the contracts in the linked Solid-Money/boring-vault repository
        (function signatures, argument order and types, events, return types). Flag any mismatch.
    - path: "{app,components,hooks,store}/**"
      instructions: |
        This is a React Native (Expo) app that also builds for web. Flag code that can crash at runtime:
        unguarded optional access, rendering undefined/null where a component or string is expected,
        hooks called conditionally, native-only modules imported from shared files without a .native/.web
        split or Platform check, and unhandled promise rejections in effects or event handlers.
        Token amounts must use bigint/viem helpers (parseUnits/formatUnits), never floating-point math.
    - path: "**/*.{ts,tsx}"
      instructions: |
        Flag changes that look committed by mistake: console.log/debugger left from debugging,
        commented-out code, hardcoded test or mock values, temporary flags left enabled, .only/.skip on
        tests, bypassed auth or validation, local URLs/IPs, and secrets. EXPO_PUBLIC_* values are bundled
        into the public app, so a secret must never be stored in one.
  pre_merge_checks:
    override_requested_reviewers_only: true
    title:
      mode: "off"
    description:
      mode: warning
    docstrings:
      mode: "off"
    custom_checks:
      - name: Backend contract match
        mode: error
        instructions: |
          Fail if the PR adds or changes a call to a Solid-Money/solid-backend endpoint that, according to
          the backend's default branch, does not exist, uses a different HTTP method, omits a required
          request field, or reads a response field the backend does not return. Pass if no API calls
          changed, or if the PR description links the solid-backend PR that adds the change.
      - name: Contract ABI match
        mode: error
        instructions: |
          Fail if the PR adds or changes an ABI, contract call or event listener whose function signature,
          argument types or event signature does not match the contract in Solid-Money/boring-vault.
          Pass if no ABI, contract call or address changed.
      - name: No secrets or sensitive data leaks
        mode: error
        instructions: |
          Fail if the PR adds a hardcoded secret, private key, mnemonic or server-side API key, stores one
          in an EXPO_PUBLIC_* variable, or logs or sends to analytics a password, JWT, OTP, private key,
          passkey credential, full card number (PAN) or CVV. Pass otherwise.
  tools:
    languagetool:
      enabled: false
    biome:
      enabled: false

chat:
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  learnings:
    scope: global
  code_guidelines:
    enabled: true
  linked_repositories:
    - repository: Solid-Money/solid-backend
      instructions: >-
        NestJS monorepo that serves this app's HTTP APIs. Controllers are apps/*/src/**/*.controller.ts,
        request/response shapes are *.dto.ts, Mongo models are *.schema.ts. flash-accounts-service =
        EXPO_PUBLIC_FLASH_API_BASE_URL, plus analytics, rewards and vault-manager services.
    - repository: Solid-Money/boring-vault
      instructions: >-
        Solidity source of the vault contracts this app calls (Teller, Accountant, BoringQueue,
        FastWithdrawManager, CardManager, TierLock). Source of truth for lib/abis/**.
